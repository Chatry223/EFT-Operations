name: EFT Operations CI and Client Build

on:
  push:
    branches: [main]
    paths:
      - 'source/EFT-Operations-1.9.1/client/**'
      - 'source/EFT-Operations-1.9.1/tools/verify-dependency-archives.py'
      - 'source/EFT-Operations-1.9.1.zip'
      - 'source/EscapeFromTarkov_Data.zip'
      - 'source/BepInEx.zip'
      - 'client/**'
      - '.github/workflows/build-client.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/EFT-Operations-1.9.1/client/**'
      - 'source/EFT-Operations-1.9.1/tools/verify-dependency-archives.py'
      - 'source/EFT-Operations-1.9.1.zip'
      - 'source/EscapeFromTarkov_Data.zip'
      - 'source/BepInEx.zip'
      - 'client/**'
      - '.github/workflows/build-client.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eft-operations-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Source and dependency verification
    runs-on: ubuntu-latest
    outputs:
      source_ready: ${{ steps.detect.outputs.source_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect source layout
        id: detect
        shell: bash
        run: |
          if [ -f user/mods/SPT-EconomyGuard/package.json ] && [ -f client/EFT.Operations.Client/EFT.Operations.Client.csproj ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
            echo "Source is already at repository root."
          elif [ -f source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/package.json ] && [ -f source/EFT-Operations-1.9.1/client/EFT.Operations.Client/EFT.Operations.Client.csproj ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
            echo "Uploaded source folder detected."
          elif [ -f source/EFT-Operations-1.9.1.zip ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
            echo "Uploaded source archive detected."
          else
            echo "source_ready=false" >> "$GITHUB_OUTPUT"
            echo "Expected source folder or archive was not found."
          fi
      - name: Verify dependency archive integrity and target hashes
        run: python3 source/EFT-Operations-1.9.1/tools/verify-dependency-archives.py

  client-build:
    name: Build BepInEx client plugin (Windows + EFT assemblies)
    needs: prepare
    if: needs.prepare.outputs.source_ready == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: pwsh
        run: |
          if (-not (Test-Path 'client/EFT.Operations.Client/EFT.Operations.Client.csproj')) {
            $nested = 'source/EFT-Operations-1.9.1'
            if (Test-Path (Join-Path $nested 'client/EFT.Operations.Client/EFT.Operations.Client.csproj')) {
              Copy-Item (Join-Path $nested '*') '.' -Recurse -Force
            } elseif (Test-Path 'source/EFT-Operations-1.9.1.zip') {
              Expand-Archive -LiteralPath 'source/EFT-Operations-1.9.1.zip' -DestinationPath '.' -Force
            }
          }
          if (-not (Test-Path 'client/EFT.Operations.Client/EFT.Operations.Client.csproj')) {
            throw 'Client source project is missing after source preparation.'
          }
      - name: Validate graphical Windows build helper
        shell: pwsh
        run: |
          $script = 'client/EFT.Operations.Client/BUILD-GUI.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell GUI builder has syntax errors.'
          }
          if (-not (Test-Path 'client/EFT.Operations.Client/BUILD-GUI.bat')) {
            throw 'One-click GUI launcher batch file is missing.'
          }
      - name: Prepare bundled build dependencies
        shell: pwsh
        run: |
          $managed = $env:EFT_MANAGED_DIR
          $core = $env:BEPINEX_CORE_DIR
          if (-not $managed -or -not (Test-Path (Join-Path $managed 'Assembly-CSharp.dll'))) {
            $dependencyRoot = Join-Path $env:RUNNER_TEMP 'EFT-Operations-Dependencies'
            $eftRoot = Join-Path $dependencyRoot 'eft'
            $bepRoot = Join-Path $dependencyRoot 'bepinex'
            New-Item -ItemType Directory -Path $eftRoot,$bepRoot -Force | Out-Null
            Expand-Archive -LiteralPath 'source/EscapeFromTarkov_Data.zip' -DestinationPath $eftRoot -Force
            $managedMatch = Get-ChildItem -LiteralPath $eftRoot -Filter 'Assembly-CSharp.dll' -File -Recurse |
              Where-Object { Test-Path (Join-Path $_.DirectoryName 'UnityEngine.CoreModule.dll') } |
              Select-Object -First 1
            if (-not $managedMatch) { throw 'Assembly-CSharp.dll and UnityEngine.CoreModule.dll were not found in the bundled EFT archive.' }
            $managed = $managedMatch.DirectoryName
            if (-not $core -or -not (Test-Path (Join-Path $core 'BepInEx.dll'))) {
              Expand-Archive -LiteralPath 'source/BepInEx.zip' -DestinationPath $bepRoot -Force
              $coreMatch = Get-ChildItem -LiteralPath $bepRoot -Filter 'BepInEx.dll' -File -Recurse |
                Where-Object { Test-Path (Join-Path $_.DirectoryName '0Harmony.dll') } |
                Select-Object -First 1
              if (-not $coreMatch) { throw 'BepInEx.dll and 0Harmony.dll were not found in the bundled BepInEx archive.' }
              $core = $coreMatch.DirectoryName
            }
          }
          if (-not $core -or -not (Test-Path (Join-Path $core 'BepInEx.dll'))) {
            $dependencyRoot = Join-Path $env:RUNNER_TEMP 'EFT-Operations-Dependencies'
            $bepRoot = Join-Path $dependencyRoot 'bepinex'
            New-Item -ItemType Directory -Path $bepRoot -Force | Out-Null
            Expand-Archive -LiteralPath 'source/BepInEx.zip' -DestinationPath $bepRoot -Force
            $coreMatch = Get-ChildItem -LiteralPath $bepRoot -Filter 'BepInEx.dll' -File -Recurse |
              Where-Object { Test-Path (Join-Path $_.DirectoryName '0Harmony.dll') } |
              Select-Object -First 1
            if (-not $coreMatch) { throw 'BepInEx.dll and 0Harmony.dll were not found in the bundled BepInEx archive.' }
            $core = $coreMatch.DirectoryName
          }
          if (-not (Test-Path (Join-Path $managed 'UnityEngine.CoreModule.dll'))) { throw 'EFT Managed path is invalid.' }
          if (-not (Test-Path (Join-Path $core '0Harmony.dll'))) { throw 'BepInEx core path is invalid.' }
          "EFT_MANAGED_DIR=$managed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BEPINEX_CORE_DIR=$core" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using EFT Managed: $managed"
          Write-Host "Using BepInEx core: $core"
      - name: Validate local EFT assembly paths
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $env:EFT_MANAGED_DIR 'UnityEngine.CoreModule.dll')) -or
              -not (Test-Path (Join-Path $env:EFT_MANAGED_DIR 'Assembly-CSharp.dll'))) {
            throw 'EFT dependency archive did not produce a valid Managed folder.'
          }
          if (-not (Test-Path (Join-Path $env:BEPINEX_CORE_DIR 'BepInEx.dll')) -or
              -not (Test-Path (Join-Path $env:BEPINEX_CORE_DIR '0Harmony.dll'))) {
            throw 'BepInEx dependency archive did not produce a valid core folder.'
          }
          $bepinexVersion = [Reflection.AssemblyName]::GetAssemblyName((Join-Path $env:BEPINEX_CORE_DIR 'BepInEx.dll')).Version.ToString()
          if ($bepinexVersion -ne '5.4.22.0') { throw "Expected BepInEx 5.4.22.0; found $bepinexVersion" }
          Write-Host "BepInEx version verified: $bepinexVersion"
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Build Release DLL
        shell: pwsh
        run: |
          msbuild client/EFT.Operations.Client/EFT.Operations.Client.csproj /restore /m /p:Configuration=Release /p:GameManagedDir="$env:EFT_MANAGED_DIR" /p:BepInExCoreDir="$env:BEPINEX_CORE_DIR" /verbosity:minimal
      - name: Verify output
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Path client/EFT.Operations.Client/bin/Release/net472 -Filter EFTOperations.Client.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) { throw 'Build reported success but EFTOperations.Client.dll was not found.' }
          Get-FileHash $dll.FullName -Algorithm SHA256 | Format-List | Out-File build-report.txt
          Copy-Item $dll.FullName ./EFTOperations.Client.dll
      - name: Upload client DLL and report
        uses: actions/upload-artifact@v4
        with:
          name: EFTOperations-Client-${{ github.sha }}
          path: |
            EFTOperations.Client.dll
            build-report.txt
          if-no-files-found: error
          retention-days: 30
