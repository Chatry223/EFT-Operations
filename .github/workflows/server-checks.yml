name: EFT Operations Server Checks

on:
  push:
    branches: [main]
    paths:
      - 'source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/**'
      - 'source/EFT-Operations-1.9.1.zip'
      - 'user/mods/SPT-EconomyGuard/**'
      - '.github/workflows/server-checks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/**'
      - 'source/EFT-Operations-1.9.1.zip'
      - 'user/mods/SPT-EconomyGuard/**'
      - '.github/workflows/server-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eft-operations-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: SPT server checks, tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          if [ -f source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/package.json ]; then
            cp -a source/EFT-Operations-1.9.1/. .
          elif [ -f source/EFT-Operations-1.9.1.zip ]; then
            unzip -q source/EFT-Operations-1.9.1.zip -d .
          fi
          test -f user/mods/SPT-EconomyGuard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (if lockfile exists)
        working-directory: user/mods/SPT-EconomyGuard
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Static checks
        working-directory: user/mods/SPT-EconomyGuard
        run: npm run check
      - name: Unit tests
        working-directory: user/mods/SPT-EconomyGuard
        run: npm test
      - name: Create installable server-mod archive
        shell: bash
        run: |
          mkdir -p dist
          archive="dist/SPT-EconomyGuard-1.9.2-${GITHUB_SHA::7}.zip"
          zip -qr "$archive" user/mods/SPT-EconomyGuard
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx 'user/mods/SPT-EconomyGuard/package.json'
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
      - name: Upload server-mod package
        uses: actions/upload-artifact@v4
        with:
          name: EFT-Operations-ServerMod-${{ github.sha }}
          path: |
            dist/SPT-EconomyGuard-1.9.2-*.zip
            dist/SPT-EconomyGuard-1.9.2-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
