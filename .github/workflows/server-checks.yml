name: EFT Operations Server Checks

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - 'user/mods/SPT-EconomyGuard/**'
      - '.github/workflows/server-checks.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eft-operations-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-status:
    name: Source bundle readiness
    runs-on: ubuntu-latest
    outputs:
      source_ready: ${{ steps.detect.outputs.source_ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect source layout
        id: detect
        shell: bash
        run: |
          if [ -f user/mods/SPT-EconomyGuard/package.json ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
          elif [ -f source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/package.json ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
          elif [ -f source/EFT-Operations-1.9.1.zip ]; then
            echo "source_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_ready=false" >> "$GITHUB_OUTPUT"
          fi
  server-tests:
    name: SPT server checks and tests
    needs: source-status
    if: needs.source-status.outputs.source_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          if [ -f source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/package.json ]; then
            cp -a source/EFT-Operations-1.9.1/. .
          elif [ -f source/EFT-Operations-1.9.1.zip ]; then
            unzip -q source/EFT-Operations-1.9.1.zip -d .
          fi
          test -f user/mods/SPT-EconomyGuard/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies (if lockfile exists)
        working-directory: user/mods/SPT-EconomyGuard
        run: |
          if [ -f package-lock.json ]; then npm ci; fi
      - name: Static checks
        working-directory: user/mods/SPT-EconomyGuard
        run: npm run check
      - name: Unit tests
        working-directory: user/mods/SPT-EconomyGuard
        run: npm test

  windows-build-helper-validation:
    name: Validate graphical Windows build helper
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell GUI builder
        shell: pwsh
        run: |
          $script = 'source/EFT-Operations-1.9.1/client/EFT.Operations.Client/BUILD-GUI.ps1'
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'PowerShell GUI builder has syntax errors.'
          }
          if (-not (Test-Path 'source/EFT-Operations-1.9.1/client/EFT.Operations.Client/BUILD-GUI.bat')) {
            throw 'One-click GUI launcher batch file is missing.'
          }
          Write-Host 'Graphical build helper syntax validated.'

  package-server-mod:
    name: Package tested SPT server mod
    needs: server-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare source tree
        shell: bash
        run: |
          if [ -f source/EFT-Operations-1.9.1/user/mods/SPT-EconomyGuard/package.json ]; then
            cp -a source/EFT-Operations-1.9.1/. .
          elif [ -f source/EFT-Operations-1.9.1.zip ]; then
            unzip -q source/EFT-Operations-1.9.1.zip -d .
          fi
          test -f user/mods/SPT-EconomyGuard/package.json
      - name: Create installable server-mod archive
        shell: bash
        run: |
          mkdir -p dist
          archive="dist/SPT-EconomyGuard-1.9.1-${GITHUB_SHA::7}.zip"
          zip -qr "$archive" user/mods/SPT-EconomyGuard
          unzip -t "$archive"
          unzip -Z1 "$archive" | grep -Fx 'user/mods/SPT-EconomyGuard/package.json'
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
      - name: Upload server-mod package
        uses: actions/upload-artifact@v4
        with:
          name: EFT-Operations-ServerMod-${{ github.sha }}
          path: |
            dist/SPT-EconomyGuard-1.9.1-*.zip
            dist/SPT-EconomyGuard-1.9.1-*.zip.sha256
          if-no-files-found: error
          retention-days: 30
